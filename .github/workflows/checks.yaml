name: Checks
# The checks a pull request can answer without building anything. The Maven build of this
# repository is the job 'publish' of publish-snapshots.yaml, and it runs on a pull
# request too. This workflow runs beside that build and is done long before it.
"on":
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run of the checks per branch, and the newest run wins. Nobody reads the answer of
  # a commit which has been pushed over. Cancelling is right here and wrong for the
  # publish group of publish-snapshots.yaml: a publish carries work which cannot
  # be repeated, a check can run again any time.
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Javadoc keeps the last block in front of an element and drops every earlier one, and it
  # says nothing while it does. The script finds such a pair. It needs a checkout and
  # nothing else, so it answers in seconds, while the Maven build is still running. That is
  # why the check stands here and not in that build: whoever left a dropped block behind
  # reads about it right away and not when the build is through.
  orphaned-javadoc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No javadoc block stands in front of another one
        run: bin/check-orphaned-javadoc.sh

  # A citation of a decision is a promise that the decision is there to read. It breaks
  # without a word: a pending decision gets its number and its file goes away, or a citation
  # names a number nobody handed out. It also breaks the other way round, when a pending
  # decision is cited by its number instead of by its file, because the search which runs at
  # the numbering then walks past it. Two such citations lived in the tree of
  # adapter-platform-integration for weeks, and the script comes from there.
  #
  # Like the check above this needs a checkout and nothing else, so it answers in seconds.
  # The self test runs first: the script joins wrapped lines, and that is the part of it
  # which a line-by-line search cannot do, so it is the part worth holding.
  decision-citation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The citation check still finds a wrapped citation
        run: bin/check-decision-citations.sh --self-test
      - name: Every citation of a decision points at something which exists
        run: bin/check-decision-citations.sh
