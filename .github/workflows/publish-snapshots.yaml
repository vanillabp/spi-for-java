name: Build and publish snapshots
# A pull request builds and tests, a push to main publishes. Both run as the job
# 'publish', so a pull request Renovate opens gets a result like every other one - it did
# not while this workflow only listened to pushes and ignored renovate/**.
#
# Publishing from main alone is the second half of it: the snapshot repository holds one
# snapshot version per module, so every branch used to overwrite what main published, and a
# consumer could resolve a set of modules which never existed in any single tree.
#
# The snapshots go to two places in one build, with the profile 'publish-snapshots' of the
# POM. GitHub Packages is what the builds of the other VanillaBP repositories read, so they
# do not ask Maven Central for every snapshot and are not stopped by its rate limit. The
# snapshot repository of Maven Central stays for everybody else: anybody can read it there
# without a login.
#
# Only a push to main publishes, and only where the Actions variable VANILLABP_PUBLISH is
# 'true'. The vanillabp organization sets it for all its repositories. A fork does not have
# it, so a push to the main branch of a fork builds and tests like a pull request and
# publishes nothing.
"on":
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # two pushes to main must not publish at the same time, and the later one has to finish
  # rather than be cancelled: it carries the newer artifacts
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # writes the snapshots to GitHub Packages of this repository. A pull request from a
      # fork gets a token which can only read, whatever this line says
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # A pull request builds with it too, so it tests with the Maven that main publishes
      # with. Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          # Into a file and not through a pipe: a transfer which breaks halfway has already
          # written to tar, so a repeat of curl could not mend it. Nine repeats wait about
          # eight minutes, long enough for a 429 of Central to pass.
          curl -fsSL --retry 9 --retry-all-errors --retry-max-time 600 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/apache-maven.tar.gz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
      # 'install' and not 'install verify': install already runs every phase verify
      # has, so naming both made Maven walk two lifecycles per module. The tests
      # skipped their second run, the compiler did not, and every javac warning was
      # reported twice - once per compilation.
      - name: Build and test
        if: "${{ github.event_name == 'pull_request' || vars.VANILLABP_PUBLISH != 'true' }}"
        run: mvn --batch-mode --update-snapshots -s .github/maven/settings.xml install
        env:
          CI: false
      # the profile 'publish-snapshots' sends the snapshot to GitHub Packages of this
      # repository and to the snapshot repository of Maven Central
      - name: Publish snapshot
        if: "${{ github.event_name == 'push' && vars.VANILLABP_PUBLISH == 'true' }}"
        run: mvn --batch-mode --update-snapshots -s .github/maven/settings.xml deploy -P publish-snapshots
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CI: false

  # Which packages the GITHUB_TOKEN of a run may read. GitHub documents this only for the
  # packages of the repository the workflow runs in. The other VanillaBP repositories will
  # read the snapshots of this one and of each other, and the blueprints read them from a
  # second organization. So this job asks once for each case and prints the HTTP status:
  # 200 is allowed, 401 or 403 is not. It never fails. Remove it once the answers are known.
  github-packages-access:
    if: "${{ github.event_name == 'pull_request' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ask GitHub Packages with the GITHUB_TOKEN of this run
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # ask <what was asked> <url> [extra curl arguments]
          ask() {
            local label="$1" url="$2" code
            shift 2
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 "$@" "$url" || true)
            echo "$code  $label"
            echo "| $code | $label |" >> "$GITHUB_STEP_SUMMARY"
          }
          login=(-u "${GITHUB_ACTOR}:${GITHUB_TOKEN}")
          metadata="2.0.0-SNAPSHOT/maven-metadata.xml"
          echo "| HTTP | what was asked |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|----------------|" >> "$GITHUB_STEP_SUMMARY"
          ask "this repository" \
            "https://maven.pkg.github.com/vanillabp/spi-for-java/io/vanillabp/spi-for-java/$metadata" "${login[@]}"
          ask "this repository, without a login" \
            "https://maven.pkg.github.com/vanillabp/spi-for-java/io/vanillabp/spi-for-java/$metadata"
          ask "another repository of the organization" \
            "https://maven.pkg.github.com/vanillabp/adapter-platform-integration/io/vanillabp/adapter/migration-adapter-spi/$metadata" "${login[@]}"
          ask "another repository, through the URL of the whole organization" \
            "https://maven.pkg.github.com/vanillabp/*/io/vanillabp/adapter/migration-adapter-spi/$metadata" "${login[@]}"
          ask "a repository of another organization (camunda-community-hub)" \
            "https://maven.pkg.github.com/camunda-community-hub/vanillabp-camunda8-adapter/org/camunda/community/vanillabp/camunda8-adapter/maven-metadata.xml" "${login[@]}"
          ask "a repository of another organization (Phactum)" \
            "https://maven.pkg.github.com/Phactum/mongodb-changesets/com/phactum/mongodb/mongodb-changesets/maven-metadata.xml" "${login[@]}"
